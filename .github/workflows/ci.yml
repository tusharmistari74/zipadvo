name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Build Packages & Application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: development
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder-proj
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "100000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:100000000000:web:abcdef"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
